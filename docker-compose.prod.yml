version: '3.8'

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-app-prod
    ports:
      - "8089:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - portfolio-network
    volumes:
      # Read-only mounts untuk static assets
      - ./public:/app/public:ro
      # Volume untuk logs
      - portfolio-logs:/app/logs
      # Volume untuk .next cache (optional)
      - portfolio-next:/app/.next
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

volumes:
  portfolio-logs:
    driver: local
  portfolio-next:
    driver: local

networks:
  portfolio-network:
    driver: bridge
